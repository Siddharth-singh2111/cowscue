# Production-like local stack:
#
#   Nginx (least-conn LB, edge rate limiting, gzip)  :8080
#     └── web × N   stateless Next.js replicas
#   worker × N      BullMQ consumers
#   redis           queue + distributed rate limits + cache
#   mongo           optional (profile "local-db"); defaults to MONGODB_URI from .env (Atlas)
#
#   docker compose up -d --build --scale web=3 --scale worker=2
#   curl -sI localhost:8080/api/health | grep x-upstream   # watch requests rotate across replicas

x-app-env: &app-env
  env_file: .env
  environment:
    NODE_ENV: production
    REDIS_URL: redis://redis:6379
    LOG_LEVEL: info

x-build: &build
  context: .
  args:
    NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    NEXT_PUBLIC_PUSHER_KEY: ${NEXT_PUBLIC_PUSHER_KEY:-}
    NEXT_PUBLIC_PUSHER_CLUSTER: ${NEXT_PUBLIC_PUSHER_CLUSTER:-ap2}
    NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME:-}
    NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET:-}
    NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:8080}

services:
  nginx:
    image: nginx:1.29-alpine
    ports: ["8080:80"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  web:
    <<: *app-env
    build: { <<: *build, target: web }
    image: cowscue-web:latest
    expose: ["3000"]
    deploy:
      replicas: 3
      resources:
        limits: { cpus: "1.0", memory: 768M }
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    <<: *app-env
    build: { <<: *build, target: worker }
    image: cowscue-worker:latest
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: "10"
      MONGO_POOL_SIZE: "20"
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "0.5", memory: 512M }
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    # BullMQ requires noeviction: evicting queue keys would silently drop jobs.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mongo:
    image: mongo:8.0
    profiles: ["local-db"]
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    restart: unless-stopped

volumes:
  redis-data:
  mongo-data:
