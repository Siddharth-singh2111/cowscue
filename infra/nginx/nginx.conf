# Edge proxy + load balancer for the Cowscue web tier.
worker_processes auto;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  server_tokens off;

  log_format main '$remote_addr "$request" $status $body_bytes_sent rt=$request_time '
                  'upstream=$upstream_addr urt=$upstream_response_time rid=$request_id';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  # Re-resolve the "web" service every 10s so scaling up/down is picked up without a reload.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream cowscue_web {
    zone cowscue_web 64k;
    least_conn;                                   # route to the replica with fewest active requests
    server web:3000 resolve max_fails=3 fail_timeout=10s;
    keepalive 64;                                 # reuse upstream connections
  }

  # Edge rate limiting (coarse, per client IP). Fine-grained per-user limits live in the app (Redis).
  limit_req_zone $binary_remote_addr zone=api:20m rate=30r/s;
  # Only mutating requests count toward the stricter "writes" zone (empty key = not limited).
  map $request_method $write_limit_key { POST $binary_remote_addr; PUT $binary_remote_addr; PATCH $binary_remote_addr; default ""; }
  limit_req_zone $write_limit_key zone=writes:20m rate=5r/s;
  limit_req_status 429;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80;
    client_max_body_size 12m;   # legacy WhatsApp bot posts base64 images

    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    # Overwrite (not append) so clients can't spoof their IP to dodge rate limits.
    proxy_set_header X-Forwarded-For    $remote_addr;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Request-ID       $request_id;
    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
    # Transparent failover: retry idempotent requests on another replica if one dies mid-flight.
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;

    add_header X-Request-ID $request_id always;
    add_header X-Upstream   $upstream_addr always;   # demo: shows which replica served the request

    location /_next/static/ {
      proxy_pass http://cowscue_web;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
      limit_req zone=api burst=60 nodelay;
      limit_req zone=writes burst=20 nodelay;
      proxy_pass http://cowscue_web;
    }

    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
    }

    location / {
      proxy_pass http://cowscue_web;
    }
  }
}
